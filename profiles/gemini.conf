# Gemini CLI (Google) under cotty agent.
#
# Login state and history: ~/.gemini (oauth_creds.json), read-write. What
# defines the commands Gemini CLI runs when you start it yourself is
# read-only inside, and created empty first when missing: settings.json
# (MCP servers, hooks, tool discovery commands), .env (loaded into its
# environment and its children's), GEMINI.md, custom commands,
# extensions, skills, policies and the trusted folders list. Gemini CLI
# has no command line flag for an extra MCP server: add cotty once,
# outside the confinement:
#   gemini mcp add --scope user cotty cotty mcp
# Gemini CLI installed with npm in $HOME needs `cotty agent --ro DIR`.

[agent]
name = gemini
description = Gemini CLI, Google's coding agent
command = gemini
match = gemini

[home]
rw = .gemini/
protect = .gemini/settings.json
protect = .gemini/.env
protect = .gemini/GEMINI.md
protect = .gemini/commands/
protect = .gemini/extensions/
protect = .gemini/skills/
protect = .gemini/policies/
protect = .gemini/trustedFolders.json

[env]
GEMINI_CLI_DISABLE_AUTO_UPDATE = true

[scrub]
keep = GEMINI_*
keep = GOOGLE_API_KEY
keep = GOOGLE_CLOUD_PROJECT
keep = GOOGLE_CLOUD_LOCATION
keep = GOOGLE_GENAI_USE_VERTEXAI

[mcp]
style = manual
