# opencode under cotty agent.
#
# Settings in ~/.config/opencode, login state and sessions in
# ~/.local/share/opencode (auth.json, opencode.db), plus its state
# directory, read-write. Its cache (~/.cache/opencode, where it installs
# plugin and provider packages, code it loads) is not shared: inside it is
# in the private home and starts empty each run. The installer puts the
# program in ~/.opencode/bin; read-only inside. What defines the code and
# commands opencode runs when you start it yourself is read-only inside,
# and created empty first when missing: opencode.json(c) and config.json
# (MCP servers, formatters, plugins, shell), plugins, custom tools,
# agents, modes, commands, skills, global instructions, and the language
# servers it downloads.

[agent]
name = opencode
description = opencode, an open source coding agent for the terminal
command = opencode
match = opencode

[home]
rw = .config/opencode/
rw = .local/share/opencode/
rw = .local/state/opencode/
ro = .opencode
protect = .config/opencode/opencode.json
protect = .config/opencode/opencode.jsonc
protect = .config/opencode/config.json
protect = .config/opencode/AGENTS.md
protect = .config/opencode/plugin/
protect = .config/opencode/plugins/
protect = .config/opencode/tool/
protect = .config/opencode/tools/
protect = .config/opencode/agent/
protect = .config/opencode/agents/
protect = .config/opencode/mode/
protect = .config/opencode/modes/
protect = .config/opencode/command/
protect = .config/opencode/commands/
protect = .config/opencode/skills/
protect = .local/share/opencode/bin/

[scrub]
keep = OPENCODE_*
keep = ANTHROPIC_API_KEY
keep = OPENAI_API_KEY
keep = OPENROUTER_API_KEY
keep = GEMINI_API_KEY
keep = GOOGLE_GENERATIVE_AI_API_KEY
keep = GROQ_API_KEY
keep = DEEPSEEK_API_KEY
keep = XAI_API_KEY
keep = MISTRAL_API_KEY

[mcp]
# cotty agent sets OPENCODE_CONFIG_CONTENT with a `cotty` MCP server.
style = opencode
