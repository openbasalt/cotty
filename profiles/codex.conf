# Codex CLI (OpenAI) under cotty agent.
#
# Login state, sessions and logs: ~/.codex (auth.json), read-write. What
# defines the commands Codex runs when you start `codex` yourself is
# read-only inside, and created empty first when missing: config.toml (MCP
# servers, notify, hooks, model provider auth commands), hooks.json, the
# execpolicy rules that approve commands, global instructions, custom
# prompts, plugins, skills and agents. Per-profile files
# (~/.codex/NAME.config.toml) are not covered; see docs/agents/codex.md.
# User skills in ~/.agents/skills are not visible inside. Codex installed
# with npm in $HOME needs `cotty agent --ro DIR` for the npm prefix.

[agent]
name = codex
description = Codex CLI, OpenAI's coding agent
command = codex
match = codex

[home]
rw = .codex/
ro = .local/bin/codex
protect = .codex/config.toml
protect = .codex/hooks.json
protect = .codex/rules/
protect = .codex/AGENTS.md
protect = .codex/prompts/
protect = .codex/plugins/
protect = .codex/skills/
protect = .codex/agents/

[scrub]
keep = OPENAI_*

[mcp]
# cotty agent adds -c mcp_servers.cotty.* overrides.
style = codex
