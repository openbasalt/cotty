# Claude Code (Anthropic) under cotty agent.
#
# Login state: ~/.claude/.credentials.json. Inside, Claude Code runs with
# CLAUDE_CONFIG_DIR=~/.claude, so its main settings file is
# ~/.claude/.claude.json instead of ~/.claude.json. Claude Code replaces
# that file by writing a temporary file next to it and renaming it over
# the old one; a rename onto a single bind-mounted file fails (EBUSY or
# EXDEV), so the file must live in a bound directory. Before the first
# launch the inside copy is seeded from ~/.claude.json without its MCP
# servers and keys (onboarding and project state carry over); after that
# the two evolve separately, and your ~/.claude.json, which can define MCP
# servers that run with your rights when you start `claude` yourself, is
# not visible inside.
#
# The native installer puts the program in ~/.local/share/claude and the
# launcher link in ~/.local/bin/claude; both are read-only inside. The
# older local install (`claude migrate-installer`) lives in
# ~/.claude/local, also read-only inside (created empty when missing). An
# npm install elsewhere in $HOME needs `cotty agent --ro DIR` for that
# directory.
#
# These paths in ~/.claude, which define what Claude Code runs or loads
# when you start it yourself, are read-only inside, and created empty
# first when missing: the local install, settings (hooks, status line, key
# helper, permissions), user instructions, rules, subagents, commands,
# skills, workflows, output styles, plugins, and the conventional hooks
# directory. Scripts those settings name are read-only too. The rest of
# ~/.claude stays writable, and some of it is loaded later by the Claude
# Code you start yourself (auto memory, shell snapshots): see the residual
# list in docs/agents/claude.md.

[agent]
name = claude
description = Claude Code, Anthropic's coding agent CLI
command = claude
match = claude

[home]
seed = .claude.json .claude/.claude.json
rw = .claude/
ro = .local/share/claude
ro = .local/bin/claude
protect = .claude/local/
protect = .claude/settings.json
protect = .claude/settings.local.json
protect = .claude/CLAUDE.md
protect = .claude/rules/
protect = .claude/agents/
protect = .claude/commands/
protect = .claude/skills/
protect = .claude/workflows/
protect = .claude/output-styles/
protect = .claude/plugins/
protect = .claude/hooks/
# The IDE extensions write ~/.claude/ide/PORT.lock with the port and an
# auth token of their local MCP server, which runs with your rights. The
# agent sees the directory empty; `cotty agent --show-hidden` keeps it
# visible when the agent should talk to your IDE.
hide = .claude/ide/

[env]
# The settings file lives in the bound directory (see above).
CLAUDE_CONFIG_DIR = ~/.claude
# The program directory is read-only inside: no self-update attempts.
DISABLE_AUTOUPDATER = 1

[scrub]
# Model provider access and Claude Code's own switches.
keep = ANTHROPIC_*
keep = CLAUDE_CODE_*
keep = MCP_TIMEOUT
keep = MCP_TOOL_TIMEOUT
keep = BASH_DEFAULT_TIMEOUT_MS
keep = BASH_MAX_TIMEOUT_MS
keep = MAX_THINKING_TOKENS
keep = DISABLE_TELEMETRY
keep = DISABLE_ERROR_REPORTING

[mcp]
# cotty agent adds --mcp-config with a `cotty` server.
style = claude
