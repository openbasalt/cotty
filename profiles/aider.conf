# Aider under cotty agent.
#
# Aider keeps caches in ~/.aider and reads ~/.aider.conf.yml and
# ~/.aider.model.settings.yml (read-only inside). API keys come from the
# environment (kept by the [scrub] list below) or from a .env file in the
# project. Installs with uv, pipx or
# pip --user are covered below (uv also keeps the Python it installed in
# ~/.local/share/uv); another location needs `cotty agent --ro`.
# Aider has no MCP client, so it is confined but cannot use cotty's
# terminal tools.

[agent]
name = aider
description = Aider, pair programming in the terminal with any model provider
command = aider
match = aider

[home]
rw = .aider/
ro = .aider.conf.yml
ro = .aider.model.settings.yml
ro = .aider.model.metadata.json
ro = .local/bin/aider
ro = .local/share/uv
ro = .local/pipx/venvs/aider-chat
ro = .local/lib

[env]
AIDER_ANALYTICS = false
AIDER_CHECK_UPDATE = false
AIDER_SHOW_RELEASE_NOTES = false

[scrub]
keep = AIDER_*
keep = OPENAI_*
keep = ANTHROPIC_API_KEY
keep = OPENROUTER_API_KEY
keep = GEMINI_API_KEY
keep = DEEPSEEK_API_KEY
keep = GROQ_API_KEY
keep = XAI_API_KEY
keep = MISTRAL_API_KEY
keep = OLLAMA_API_BASE

[mcp]
style = none
