# Generic profile: any program, nothing from $HOME but the project and the
# common read-only files every profile gets (git identity). Used when the
# command matches no other profile. Give a tool its own directories with
# `cotty agent --rw DIR` or `--ro DIR`, or copy this file to
# ~/.config/cotty/profiles/NAME.conf and edit it.

[agent]
name = generic
description = Any program, with only the project and git identity from $HOME

[mcp]
style = none
