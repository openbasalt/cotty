# Cursor CLI (cursor-agent) under cotty agent.
#
# Login state and settings: ~/.cursor and ~/.config/cursor (auth.json),
# read-write. The installer puts the program in
# ~/.local/share/cursor-agent with links in ~/.local/bin; read-only inside.
# What defines the commands Cursor runs when you start it yourself is
# read-only inside, and created empty first when missing: mcp.json (MCP
# servers), cli-config.json (command permissions), hooks.json and hook
# scripts, rules, skills, agents and commands. The Cursor IDE keeps its
# extensions and its launch arguments in the same directory
# (~/.cursor/extensions, ~/.cursor/argv.json): read-only inside too, so
# the agent cannot change code the IDE runs. Add cotty once, outside the
# confinement, to ~/.cursor/mcp.json:
#   {"mcpServers": {"cotty": {"command": "cotty", "args": ["mcp"]}}}

[agent]
name = cursor-agent
description = Cursor CLI, Cursor's coding agent for the terminal
command = cursor-agent
match = cursor-agent

[home]
rw = .cursor/
rw = .config/cursor/
ro = .local/share/cursor-agent
ro = .local/bin/cursor-agent
ro = .local/bin/agent
protect = .cursor/mcp.json
protect = .cursor/cli-config.json
protect = .cursor/hooks.json
protect = .cursor/hooks/
protect = .cursor/rules/
protect = .cursor/skills/
protect = .cursor/agents/
protect = .cursor/commands/
protect = .cursor/extensions/
protect = .cursor/argv.json

[scrub]
keep = CURSOR_API_KEY

[mcp]
style = manual
