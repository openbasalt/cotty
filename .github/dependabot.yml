# Dependency update pull requests: Go modules (and the toolchain line of
# go.mod) and the GitHub Actions, which the workflows pin by full commit
# SHA. One grouped pull request per ecosystem per week.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
