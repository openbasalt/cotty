name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Build, vet and unit tests only. Sessions, the confinement and the
    # escape matrix run in lab VMs (make vm-*), never on CI runners.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      # Actions are pinned by commit SHA; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go-version-file installs exactly the go line of go.mod, so that
      # line names the patch release the binaries are built with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt, vet, unit tests
        run: make check
      - name: build
        run: make build
      - name: cgo builds are refused
        run: |
          if CGO_ENABLED=1 go build -o /dev/null ./cmd/cotty 2>/dev/null; then
            echo "a cgo build of cotty succeeded" >&2
            exit 1
          fi
